apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    
    defaultConfig {
        applicationId "com.vanity.miner"
        minSdkVersion 23
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"
        
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11 -O2"
            }
        }
    }
    
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
